workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

variables:
  CI: "true"

stages:
  - test
  - build

test:
  stage: test
  image: alpine:3.22.4
  script:
    - apk add --no-cache bash
    - bash -n entrypoint.sh

build-image:
  stage: build
  tags:
    - kaniko
  image:
    name: registry.gitlab.com/gitlab-ci-utils/container-images/kaniko:debug
    entrypoint: [""]
  needs:
    - test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - test -n "$HARBOR_HOST"
    - test -n "$HARBOR_PROJECT"
    - test -n "$HARBOR_USERNAME"
    - test -n "$HARBOR_PASSWORD"
    - export IMAGE_REPO="${HARBOR_HOST}/${HARBOR_PROJECT}/kaniko-cache/bw"
    - export EXTRA_DESTINATION=""
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then EXTRA_DESTINATION="--destination ${IMAGE_REPO}:${CI_COMMIT_TAG}"; fi
    - >-
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_REPO}:${CI_COMMIT_SHA}"
      ${EXTRA_DESTINATION}
      --cache=true
      --cache-repo "${HARBOR_HOST}/${HARBOR_PROJECT}/kaniko-cache/${CI_PROJECT_PATH_SLUG}"
      --digest-file "${CI_PROJECT_DIR}/image-digest.txt"
      --image-name-with-digest-file "${CI_PROJECT_DIR}/image-name-with-digest.txt"
      --build-arg "VCS_REF=${CI_COMMIT_SHA}"
      --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --label "org.opencontainers.image.source=${CI_PROJECT_URL}"
      --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}"
  artifacts:
    when: always
    paths:
      - image-digest.txt
      - image-name-with-digest.txt
