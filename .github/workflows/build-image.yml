name: Build image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check entrypoint syntax
        run: bash -n entrypoint.sh

  build-image:
    runs-on: ubuntu-latest
    needs:
      - test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build date
        id: build-date
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=Bitwarden CLI server image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-date.outputs.created }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write image digest artifacts
        run: |
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          digest="${{ steps.build.outputs.digest }}"
          printf '%s\n' "$digest" > image-digest.txt
          printf '%s@%s\n' "$image" "$digest" > image-name-with-digest.txt

      - name: Upload image digest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: |
            image-digest.txt
            image-name-with-digest.txt
